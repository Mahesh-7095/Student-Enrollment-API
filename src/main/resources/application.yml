# Default profile: in-memory H2 -> runs with zero setup.
# For PostgreSQL run with:  --spring.profiles.active=postgres   (see README)
spring:
  application:
    name: student-enrollment-api
  datasource:
    url: jdbc:h2:mem:enrollmentdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
